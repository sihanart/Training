<defs>
<style>#svg-lab text{font-family:"IBM Plex Sans Thai","Sarabun","Loma","Noto Sans Thai","Sarabun","Segoe UI",sans-serif;fill:#0F1E2E}#svg-lab .h1{font-size:28px;font-weight:700}#svg-lab .sub{font-size:14px;fill:#5A6C7D}#svg-lab .lbl{font-size:15px;font-weight:700}#svg-lab .lbl2{font-size:13px;font-weight:700}#svg-lab .role{font-size:11.5px;fill:#41545F}#svg-lab .tiny{font-size:11px;fill:#5A6C7D}#svg-lab .tag{font-size:11px;font-weight:700;fill:#fff}#svg-lab .th{font-size:11.5px;font-weight:700;fill:#1E6BB8}#svg-lab .td{font-size:11.5px;fill:#33454F}#svg-lab .link{stroke:#4A6274;stroke-width:2.5;fill:none}#svg-lab .link10{stroke:#0E7C86;stroke-width:5;fill:none;stroke-linecap:round}#svg-lab .stackl{stroke:#0E7C86;stroke-width:7;fill:none;stroke-linecap:round}#svg-lab .tunnel{stroke:#FF8300;stroke-width:3;stroke-dasharray:9 6;fill:none}#svg-lab .radius{stroke:#6B4EA8;stroke-width:2.5;stroke-dasharray:3 5;fill:none}#svg-lab .air{stroke:#14996B;stroke-width:2;fill:none;opacity:.75}#svg-lab .grp{fill:#FAFCFE;stroke:#C7D6E2;stroke-width:1.5;stroke-dasharray:6 5}
</style>
<marker id="ar-svg-lab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0 0 L10 5 L0 10 z" fill="#FF8300"/></marker>
</defs>

<rect width="1440" height="1130" fill="#FFFFFF"/>
<text class="h1" x="40" y="48">Aruba Campus Network Training — Lab Topology</text>
<text class="sub" x="40" y="74">RMUTT × Commserv Siam · 26 ส.ค. 2569 · Module 1: Aruba Switch (CX) — Module 2: Mobility Controller + Access Point</text>
<line x1="40" y1="90" x2="1400" y2="90" stroke="#E1E9EF" stroke-width="2"/>

<!-- Internet + edge -->
<path d="M75 148 a30 30 0 0 1 30-30 h110 a30 30 0 0 1 0 60 h-110 a30 30 0 0 1-30-30z" fill="#EEF3F7" stroke="#8FA6B6" stroke-width="2"/>
<text class="lbl" x="128" y="143">Internet</text>
<text class="tiny" x="95" y="160">Venue WAN / 4G Router</text>
<rect x="75" y="215" width="180" height="58" rx="8" fill="#FDECEC" stroke="#C0504D" stroke-width="2"/>
<text class="lbl2" x="90" y="240">NAT Router / Firewall</text>
<text class="role" x="90" y="259">VLAN 100 · 192.168.100.254</text>
<line class="link" x1="165" y1="178" x2="165" y2="215"/>
<line class="link" x1="255" y1="244" x2="330" y2="244"/>

<!-- Core -->
<rect x="330" y="185" width="470" height="122" rx="10" fill="#E8F1F8" stroke="#1E6BB8" stroke-width="2.5"/>
<rect x="330" y="185" width="470" height="26" rx="10" fill="#1E6BB8"/>
<text class="tag" x="344" y="203">CORE (ใช้ร่วมกันทุก Pod) — Aruba CX 8325 / CX 6300M</text>
<text class="role" x="344" y="233">• SVI ทุก VLAN ของทุก Pod + Inter-VLAN routing</text>
<text class="role" x="344" y="252">• DHCP relay (ip helper-address » Services VM) หรือ DHCP pool บน Core</text>
<text class="role" x="344" y="271">• Default route 0.0.0.0/0 » 192.168.100.254</text>
<text class="role" x="344" y="290">• Uplink 10G + LAG ลงทุก Pod / ขึ้น Controller</text>

<!-- Mobility Controller -->
<rect x="1000" y="118" width="400" height="122" rx="10" fill="#FFF3E6" stroke="#FF8300" stroke-width="2.5"/>
<rect x="1000" y="118" width="400" height="26" rx="10" fill="#FF8300"/>
<text class="tag" x="1014" y="136">MOBILITY CONTROLLER (AOS-8) — 7010 / VMC</text>
<text class="role" x="1014" y="166">• AP onboarding + GRE tunnel termination</text>
<text class="role" x="1014" y="185">• WLAN/SSID, VLAN, AAA profile, User Role</text>
<text class="role" x="1014" y="204">• Captive portal, Application Control (AppRF)</text>
<text class="role" x="1014" y="223">• Dashboard / Monitoring — MGMT 192.168.200.10</text>
<path class="link10" d="M800 200 H 1000"/>
<text class="tiny" x="812" y="190">LAG 2x10G (VLAN 200 + user VLANs)</text>

<!-- ClearPass -->
<rect x="1000" y="262" width="400" height="96" rx="10" fill="#F1ECFB" stroke="#6B4EA8" stroke-width="2.5"/>
<text class="lbl2" x="1014" y="288">ClearPass Policy Manager (VM) — RADIUS</text>
<text class="role" x="1014" y="308">• 802.1X: wired (Module 1) + wireless (Module 2)</text>
<text class="role" x="1014" y="327">• MAC Authentication (IoT) · Guest self-register</text>
<text class="role" x="1014" y="346">• 192.168.200.20 — shared secret ต่อ Pod</text>
<path class="radius" d="M1000 300 H 880 V 307"/>

<!-- Services -->
<rect x="1000" y="378" width="400" height="66" rx="10" fill="#EFF6F1" stroke="#4B8F6E" stroke-width="2"/>
<text class="lbl2" x="1014" y="402">Services VM — DHCP / DNS / NTP / CA / Syslog</text>
<text class="role" x="1014" y="424">192.168.200.30 · ปลายทางของ DHCP relay</text>
<path class="link" d="M1000 410 H 850 V 307"/>

<!-- Tunnel indication -->
<path class="tunnel" marker-end="url(#ar-svg-lab)" d="M700 330 C 820 380 900 330 985 250" />
<text class="tiny" x="622" y="398" fill="#C4620A" font-size="12" font-weight="700">GRE Tunnel: AP » MC</text>

<path class="link10" d="M150 512 L 424 307"/>
<path class="link10" d="M410 512 L 518 307"/>
<path class="link10" d="M610 512 L 612 307"/>
<path class="link10" d="M870 512 L 706 307"/>
<text class="tiny" x="74" y="446">LAG 2x10G (SFP+) ขึ้น Core</text>

<!-- ============ POD 1 ============ -->
<rect class="grp" x="60" y="470" width="440" height="420" rx="12"/>
<rect x="60" y="470" width="120" height="28" rx="10" fill="#1E6BB8"/>
<text class="tag" x="76" y="489">POD 1 (2–3 คน)</text>

<rect x="82" y="512" width="396" height="106" rx="9" fill="#F2F7FB" stroke="#1E6BB8" stroke-width="1.5" stroke-dasharray="5 4"/>
<text class="lbl2" x="96" y="534">Access Stack — 2x Aruba CX 6300F 24G PoE+ (VSF)</text>
<rect x="96" y="546" width="170" height="58" rx="7" fill="#E9F2FA" stroke="#1E6BB8" stroke-width="2"/>
<text class="lbl2" x="110" y="568">SW1-POD1</text>
<text class="role" x="110" y="588">Commander · Mbr 1</text>
<rect x="296" y="546" width="170" height="58" rx="7" fill="#E9F2FA" stroke="#1E6BB8" stroke-width="2"/>
