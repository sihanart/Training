<text class="role" x="310" y="588">Standby · Mbr 2</text>
<path class="stackl" d="M266 575 H 296"/>
<text class="tiny" x="238" y="640">VSF stack link</text>

<rect x="88" y="676" width="118" height="66" rx="9" fill="#E9F7F1" stroke="#14996B" stroke-width="2"/>
<text class="lbl2" x="102" y="700">AP-515</text>
<text class="role" x="102" y="720">PoE+ · port 1/1/1</text>
<rect x="222" y="676" width="118" height="66" rx="9" fill="#E9F7F1" stroke="#14996B" stroke-width="2"/>
<text class="lbl2" x="236" y="700">AP-505</text>
<text class="role" x="236" y="720">PoE+ · port 2/1/1</text>
<rect x="356" y="676" width="122" height="66" rx="9" fill="#F5F7F8" stroke="#8FA6B6" stroke-width="2"/>
<text class="lbl2" x="370" y="700">PC (wired)</text>
<text class="role" x="370" y="720">802.1X + DHCP test</text>
<line class="link" x1="147" y1="604" x2="147" y2="676"/>
<line class="link" x1="281" y1="604" x2="281" y2="676"/>
<line class="link" x1="417" y1="604" x2="417" y2="676"/>
<text class="tiny" x="152" y="646">PoE+</text>
<text class="tiny" x="422" y="646">VLAN 12</text>

<path class="air" d="M118 668 a38 38 0 0 1 56 0"/>
<path class="air" d="M252 668 a38 38 0 0 1 56 0"/>
<rect x="88" y="790" width="252" height="62" rx="9" fill="#F5F7F8" stroke="#8FA6B6" stroke-width="2"/>
<text class="lbl2" x="102" y="813">Wireless clients</text>
<text class="role" x="102" y="832">Notebook / Mobile / IoT</text>
<line class="link" x1="214" y1="742" x2="214" y2="790" stroke-dasharray="4 4"/>
<text class="role" x="88" y="874">SSID: POD1-EMP (802.1X) · POD1-GUEST (Portal) · POD1-IOT (PSK/MAC)</text>

<!-- ============ POD 2 ============ -->
<rect class="grp" x="520" y="470" width="440" height="420" rx="12"/>
<rect x="520" y="470" width="120" height="28" rx="10" fill="#1E6BB8"/>
<text class="tag" x="536" y="489">POD 2 (2–3 คน)</text>

<rect x="542" y="512" width="396" height="106" rx="9" fill="#F2F7FB" stroke="#1E6BB8" stroke-width="1.5" stroke-dasharray="5 4"/>
<text class="lbl2" x="556" y="534">Access Stack — 2x Aruba CX 6300F 24G PoE+ (VSF)</text>
<rect x="556" y="546" width="170" height="58" rx="7" fill="#E9F2FA" stroke="#1E6BB8" stroke-width="2"/>
<text class="lbl2" x="570" y="568">SW1-POD2</text>
<text class="role" x="570" y="588">Commander · Mbr 1</text>
<rect x="756" y="546" width="170" height="58" rx="7" fill="#E9F2FA" stroke="#1E6BB8" stroke-width="2"/>
<text class="lbl2" x="770" y="568">SW2-POD2</text>
<text class="role" x="770" y="588">Standby · Mbr 2</text>
<path class="stackl" d="M726 575 H 756"/>

<rect x="548" y="676" width="118" height="66" rx="9" fill="#E9F7F1" stroke="#14996B" stroke-width="2"/>
<text class="lbl2" x="562" y="700">AP-515</text>
<text class="role" x="562" y="720">PoE+ · port 1/1/1</text>
<rect x="682" y="676" width="118" height="66" rx="9" fill="#E9F7F1" stroke="#14996B" stroke-width="2"/>
<text class="lbl2" x="696" y="700">AP-505</text>
<text class="role" x="696" y="720">PoE+ · port 2/1/1</text>
<rect x="816" y="676" width="122" height="66" rx="9" fill="#F5F7F8" stroke="#8FA6B6" stroke-width="2"/>
<text class="lbl2" x="830" y="700">PC (wired)</text>
<text class="role" x="830" y="720">802.1X + DHCP test</text>
<line class="link" x1="607" y1="604" x2="607" y2="676"/>
<line class="link" x1="741" y1="604" x2="741" y2="676"/>
<line class="link" x1="877" y1="604" x2="877" y2="676"/>
<text class="tiny" x="882" y="646">VLAN 22</text>

<path class="air" d="M578 668 a38 38 0 0 1 56 0"/>
<path class="air" d="M712 668 a38 38 0 0 1 56 0"/>
<rect x="548" y="790" width="252" height="62" rx="9" fill="#F5F7F8" stroke="#8FA6B6" stroke-width="2"/>
<text class="lbl2" x="562" y="813">Wireless clients</text>
<text class="role" x="562" y="832">Notebook / Mobile / IoT</text>
<line class="link" x1="674" y1="742" x2="674" y2="790" stroke-dasharray="4 4"/>
<text class="role" x="548" y="874">SSID: POD2-EMP (802.1X) · POD2-GUEST (Portal) · POD2-IOT (PSK/MAC)</text>

<!-- ============ POD n note ============ -->
<rect class="grp" x="1000" y="470" width="400" height="420" rx="12"/>
<rect x="1000" y="470" width="150" height="28" rx="10" fill="#7A8C99"/>
<text class="tag" x="1016" y="489">POD 3 ... POD n</text>
<text class="role" x="1016" y="524">• อุปกรณ์และการต่อสายเหมือน Pod 1 ทุกประการ</text>
<text class="role" x="1016" y="546">• เปลี่ยนเฉพาะ VLAN ID / Subnet / ชื่อ SSID ตามตารางด้านล่าง</text>
<text class="role" x="1016" y="568">• แนะนำ 2–3 คน/Pod เพื่อให้ทุกคนได้ลงมือ config</text>

<line x1="1016" y1="588" x2="1384" y2="588" stroke="#E1E9EF" stroke-width="1.5"/>
<text class="lbl2" x="1016" y="612">ถ้าอุปกรณ์ไม่พอ (ปรับได้)</text>
<text class="role" x="1016" y="634">• Stack: ถ้ามีสวิตช์ตัวเดียว/Pod » สอน VSF แบบ demo รวม</text>
<text class="role" x="1016" y="656">• Controller: ใช้ MC ตัวเดียวร่วมกันได้ แยก SSID + VLAN ต่อ Pod</text>
<text class="role" x="1016" y="678">  (แต่ละ Pod สร้าง WLAN/AAA profile ของตัวเอง ไม่ทับกัน)</text>
<text class="role" x="1016" y="700">• ClearPass: 1 VM ใช้ร่วม — เพิ่ม NAD ทุก Pod, Service แยกตาม NAD</text>
<text class="role" x="1016" y="722">• AP: อย่างน้อย 1 ตัว/Pod (2 ตัว จะสาธิต roaming ได้)</text>

<line x1="1016" y1="742" x2="1384" y2="742" stroke="#E1E9EF" stroke-width="1.5"/>
<text class="lbl2" x="1016" y="766">อุปกรณ์ที่ผู้เข้าอบรมต้องเตรียม</text>
<text class="role" x="1016" y="788">• Notebook 1 เครื่อง (มี LAN port หรือ USB-LAN) + สาย Console/USB-C</text>
<text class="role" x="1016" y="810">• PuTTY / SecureCRT, Wi-Fi adapter, มือถือสำหรับทดสอบ Guest portal</text>
<text class="role" x="1016" y="832">• Switch MGMT: 192.168.200.x/24 (VLAN 200) เข้าถึง MC/CPPM ได้</text>
<text class="role" x="1016" y="862">* ตรวจสอบว่า Venue อนุญาตให้ตั้ง SSID เพิ่มได้ และไม่ชนช่องสัญญาณ</text>

