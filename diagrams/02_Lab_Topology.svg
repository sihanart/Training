</defs>

<rect width="1440" height="1120" fill="#FFFFFF"/>
<text class="h1" x="40" y="48">Aruba Campus Network Training — Lab Topology</text>
<text class="sub" x="40" y="74">RMUTT × Commserv Siam · 26 ส.ค. 2569 · Mobility Controller: Aruba 9004-LTE (ArubaOS 8.7.1.2) · 7 ชุดนักศึกษา + 1 ชุดผู้สอน</text>
<line x1="40" y1="90" x2="1400" y2="90" stroke="#E1E9EF" stroke-width="2"/>

<!-- internet + management uplink -->
<path d="M75 148 a30 30 0 0 1 30-30 h110 a30 30 0 0 1 0 60 h-110 a30 30 0 0 1-30-30z" fill="#EEF3F7" stroke="#8FA6B6" stroke-width="2"/>
<text class="lbl" x="128" y="143">Internet</text>
<text class="tiny" x="96" y="160">Venue WAN / LTE</text>
<rect x="70" y="212" width="190" height="58" rx="8" fill="#FDECEC" stroke="#C0504D" stroke-width="2"/>
<text class="lbl2" x="86" y="237">Internet Gateway / FW</text>
<text class="role" x="86" y="256">ทางออกของ management net</text>
<line class="link" x1="165" y1="178" x2="165" y2="212"/>
<line class="link" x1="260" y1="241" x2="330" y2="241"/>

<!-- core -->
<rect x="330" y="180" width="470" height="122" rx="10" fill="#E8F1F8" stroke="#1E6BB8" stroke-width="2.5"/>
<rect x="330" y="180" width="470" height="26" rx="10" fill="#1E6BB8"/>
<text class="tag" x="344" y="198">CORE / DISTRIBUTION SWITCH (ใช้ร่วมทุกชุด)</text>
<text class="role" x="344" y="228">• Trunk VLAN 2601–2608 ลงทุก Pod + Management VLAN</text>
<text class="role" x="344" y="248">• Management network <tspan class="ip">192.168.10.0/24</tspan> (Controller ทุกตัวอยู่วงนี้)</text>
<text class="role" x="344" y="268">• เส้นทางออก Internet ของทุก Controller</text>
<text class="role" x="344" y="288">• Uplink 10G / LAG ลง Access switch ของแต่ละ Pod</text>

<!-- what the controller is for -->
<rect x="1000" y="118" width="400" height="128" rx="10" fill="#FFF3E6" stroke="#FF8300" stroke-width="2.5"/>
<rect x="1000" y="118" width="400" height="26" rx="10" fill="#FF8300"/>
<text class="tag" x="1014" y="136">MOBILITY CONTROLLER — ARUBA 9004-LTE · AOS 8.7.1.2</text>
<text class="role" x="1014" y="166">• 1 ตัวต่อ 1 ชุด — AP termination (GRE), WLAN/SSID, User role</text>
<text class="role" x="1014" y="186">• เป็น DHCP server ของ AP VLAN ของตัวเอง (service dhcp)</text>
<text class="role" x="1014" y="206">• ip nat inside บน SVI ของ AP VLAN » NAT ออก uplink</text>
<text class="role" x="1014" y="226">• Application control (AppRF) + Dashboard</text>

<!-- which controller belongs to which pod -->
<rect x="1000" y="282" width="400" height="264" rx="10" fill="#FFFFFF" stroke="#C7D6E2" stroke-width="1.5"/>
<text class="lbl2" x="1014" y="306">การจัด Controller / AP VLAN ต่อชุด</text>
<text class="th" x="1024" y="326">ชุด</text><text class="th" x="1120" y="326">CONTROLLER IP</text><text class="th" x="1268" y="326">AP VLAN</text>
<line x1="1014" y1="331" x2="1386" y2="331" stroke="#DCE6ED"/>
<rect x="1014" y="335" width="372" height="24" fill="#F7FAFC"/><text class="td" x="1024" y="352">POD 1</text><text class="td mono2" x="1120" y="352">192.168.10.221</text><text class="td mono2" x="1268" y="352">VLAN 2601</text>
<rect x="1014" y="359" width="372" height="24" fill="#FFFFFF"/><text class="td" x="1024" y="376">POD 2</text><text class="td mono2" x="1120" y="376">192.168.10.222</text><text class="td mono2" x="1268" y="376">VLAN 2602</text>
<rect x="1014" y="383" width="372" height="24" fill="#F7FAFC"/><text class="td" x="1024" y="400">POD 3</text><text class="td mono2" x="1120" y="400">192.168.10.223</text><text class="td mono2" x="1268" y="400">VLAN 2603</text>
<rect x="1014" y="407" width="372" height="24" fill="#FFFFFF"/><text class="td" x="1024" y="424">POD 4</text><text class="td mono2" x="1120" y="424">192.168.10.224</text><text class="td mono2" x="1268" y="424">VLAN 2604</text>
<rect x="1014" y="431" width="372" height="24" fill="#F7FAFC"/><text class="td" x="1024" y="448">POD 5</text><text class="td mono2" x="1120" y="448">192.168.10.225</text><text class="td mono2" x="1268" y="448">VLAN 2605</text>
<rect x="1014" y="455" width="372" height="24" fill="#FFFFFF"/><text class="td" x="1024" y="472">POD 6</text><text class="td mono2" x="1120" y="472">192.168.10.226</text><text class="td mono2" x="1268" y="472">VLAN 2606</text>
<rect x="1014" y="479" width="372" height="24" fill="#F7FAFC"/><text class="td" x="1024" y="496">POD 7</text><text class="td mono2" x="1120" y="496">192.168.10.227</text><text class="td mono2" x="1268" y="496">VLAN 2607</text>
<rect x="1014" y="503" width="372" height="24" fill="#FFF3E6"/><text class="td tteach" x="1024" y="520">TEACHER</text><text class="td mono2" x="1120" y="520">192.168.10.133</text><text class="td mono2" x="1268" y="520">VLAN 2608</text>
<text class="tiny" x="1014" y="538">ทุก Controller อยู่บน management network เดียวกัน 192.168.10.0/24</text>

<!-- DHCP / NAT, which live on the controller here rather than the core -->
<rect x="1000" y="566" width="400" height="304" rx="10" fill="#EFF6F1" stroke="#4B8F6E" stroke-width="2"/>
<text class="lbl2" x="1014" y="592">DHCP + NAT ที่ตั้งบน Controller แต่ละตัว</text>
<text class="role" x="1014" y="616">• Pool ของ AP VLAN 260n — <tspan class="mono2">10.26.n.0/24</tspan></text>
<text class="role" x="1014" y="638">• Gateway / SVI — <tspan class="mono2">10.26.n.1</tspan> (บน controller)</text>
<text class="role" x="1014" y="660">• แจกจริง <tspan class="mono2">.11–.240</tspan> · lease 8 ชม.</text>
<text class="role" x="1014" y="682">• Exclude <tspan class="mono2">.1–.10</tspan> และ <tspan class="mono2">.241–.254</tspan></text>
<text class="role" x="1014" y="704">• <tspan class="mono2">service dhcp</tspan> ต้องเปิด ไม่งั้น pool ไม่ทำงาน</text>
<text class="role" x="1014" y="726">• <tspan class="mono2">ip nat inside</tspan> บน interface vlan 260n</text>
<line x1="1014" y1="746" x2="1386" y2="746" stroke="#CBDDD2"/>
<text class="lbl2" x="1014" y="770">คำสั่งตรวจสอบ</text>
<text class="role mono2" x="1014" y="792">show ip dhcp binding</text>
<text class="role mono2" x="1014" y="812">show ip dhcp statistics</text>
<text class="role mono2" x="1014" y="832">show ap database / show ap active</text>
<text class="role mono2" x="1014" y="852">show datapath session table</text>

