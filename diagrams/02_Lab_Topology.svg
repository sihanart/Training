<line x1="538" y1="966" x2="942" y2="966" stroke="#DCE6ED"/>
<text class="td" x="538" y="984">n1</text><text class="td" x="596" y="984">MGMT (Switch / AP)</text><text class="td" x="812" y="984">10.n.1.0/24</text>
<text class="td" x="538" y="1002">n2</text><text class="td" x="596" y="1002">Wired Users — 802.1X</text><text class="td" x="812" y="1002">10.n.2.0/24</text>
<text class="td" x="538" y="1020">n3</text><text class="td" x="596" y="1020">WLAN Employee — 802.1X</text><text class="td" x="812" y="1020">10.n.3.0/24</text>
<text class="td" x="538" y="1038">n4</text><text class="td" x="596" y="1038">WLAN Guest — Captive portal</text><text class="td" x="812" y="1038">10.n.4.0/24</text>
<text class="td" x="538" y="1056">n5</text><text class="td" x="596" y="1056">WLAN IoT — PSK + MAC Auth</text><text class="td" x="812" y="1056">10.n.5.0/24</text>
<text class="td" x="538" y="1074">100</text><text class="td" x="596" y="1074">Transit / Internet uplink</text><text class="td" x="812" y="1074">192.168.100.0/24</text>
<text class="td" x="538" y="1092">200</text><text class="td" x="596" y="1092">Servers: MC / CPPM / DHCP</text><text class="td" x="812" y="1092">192.168.200.0/24</text>

<rect x="1000" y="912" width="400" height="192" rx="10" fill="#F7FAFC" stroke="#E1E9EF" stroke-width="1.5"/>
<text class="lbl2" x="1018" y="938">หัวข้อในหลักสูตร » ทำที่ไหนในแลบ</text>
<text class="td" x="1018" y="960">M1 Stacking / LAG / 10G uplink » SW1+SW2 — Core</text>
<text class="td" x="1018" y="979">M1 PoE budget / Redundant PSU » พอร์ตที่ต่อ AP</text>
<text class="td" x="1018" y="998">M1 VLAN » VLAN n1–n5 บน Access + Core</text>
<text class="td" x="1018" y="1017">M1 Routing / DHCP relay » SVI + ip helper บน Core</text>
<text class="td" x="1018" y="1036">M1 802.1X (wired) » PC » SW » ClearPass</text>
<text class="td" x="1018" y="1055">M2 AP onboarding / WLAN » AP — MC (GRE)</text>
<text class="td" x="1018" y="1074">M2 PSK / Portal / 802.1X / MAC » 3 SSID ต่อ Pod</text>
<text class="td" x="1018" y="1093">M2 AppRF policy + Dashboard » User Role บน MC</text>
