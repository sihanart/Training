<?xml version="1.0" encoding="UTF-8"?>
<svg width="1400" height="900" id="svg-overview" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900">
<defs>
<style>#svg-overview text{font-family:"IBM Plex Sans Thai","Sarabun","Loma","Noto Sans Thai","Sarabun","Segoe UI",sans-serif;fill:#0F1E2E}#svg-overview .h1{font-size:28px;font-weight:700}#svg-overview .sub{font-size:14px;fill:#5A6C7D}#svg-overview .lbl{font-size:15px;font-weight:700}#svg-overview .lbl2{font-size:13px;font-weight:700}#svg-overview .role{font-size:11.5px;fill:#41545F}#svg-overview .tiny{font-size:11px;fill:#5A6C7D}#svg-overview .tag{font-size:11px;font-weight:700;fill:#fff}#svg-overview .link{stroke:#4A6274;stroke-width:2.5;fill:none}#svg-overview .mgmt{stroke:#0E7C86;stroke-width:5;fill:none;stroke-linecap:round}#svg-overview .auth{stroke:#6B4EA8;stroke-width:2.5;stroke-dasharray:3 5;fill:none}#svg-overview .data{stroke:#1E6BB8;stroke-width:3;fill:none}#svg-overview .air{stroke:#14996B;stroke-width:2;fill:none;opacity:.75}#svg-overview .grp{fill:#FAFCFE;stroke:#C7D6E2;stroke-width:1.5;stroke-dasharray:6 5}#svg-overview .cloud{fill:#F7FAFE;stroke:#8FB3D9;stroke-width:2;stroke-dasharray:8 6}
</style>
<marker id="am-svg-overview" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0 0 L10 5 L0 10 z" fill="#6B4EA8"/></marker>
<marker id="ad-svg-overview" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0 0 L10 5 L0 10 z" fill="#1E6BB8"/></marker>
</defs>

<rect width="1400" height="900" fill="#FFFFFF"/>
<text class="h1" x="40" y="48">HPE Aruba Networking Central (CNX) — Cloud Architecture</text>
<text class="sub" x="40" y="72">Cloud-managed wireless · Control plane บน cloud, data plane ที่ไซต์ — ตัวอย่าง / Commserv Siam · 1 ธ.ค. 2569</text>
<line x1="40" y1="88" x2="1360" y2="88" stroke="#E1E9EF" stroke-width="2"/>

<!-- ============ CLOUD ============ -->
<rect class="cloud" x="350" y="104" width="740" height="226" rx="16"/>
<text class="tiny" x="366" y="126" fill="#4C7BA8" font-weight="700">HPE ARUBA NETWORKING CENTRAL — CLOUD (SaaS)</text>

<rect x="368" y="142" width="346" height="170" rx="10" fill="#E8F1F8" stroke="#1E6BB8" stroke-width="2.5"/>
<rect x="368" y="142" width="346" height="26" rx="10" fill="#1E6BB8"/>
<text class="tag" x="382" y="160">CENTRAL — CONFIG &amp; OPERATIONS</text>
<text class="lbl2" x="382" y="188">New Central (CNX)</text>
<text class="role" x="382" y="210">• Configuration Group · Site · Label</text>
<text class="role" x="382" y="229">• Device onboarding + License assignment</text>
<text class="role" x="382" y="248">• Firmware compliance</text>
<text class="role" x="382" y="267">• Monitoring · Floorplan · Reporting</text>
<text class="role" x="382" y="286">• WLAN tuning (AI Insights / RF)</text>

<rect x="726" y="142" width="346" height="170" rx="10" fill="#F1ECFB" stroke="#6B4EA8" stroke-width="2.5"/>
<rect x="726" y="142" width="346" height="26" rx="10" fill="#6B4EA8"/>
<text class="tag" x="740" y="160">CENTRAL NAC / CENTRAL POLICY MANAGER</text>
<text class="lbl2" x="740" y="188">Cloud NAC</text>
<text class="role" x="740" y="210">• Cloud RADIUS — ไม่ต้องมี server ที่ไซต์</text>
<text class="role" x="740" y="229">• 802.1X (EAP) · MAC Authentication</text>
<text class="role" x="740" y="248">• Guest self-registration portal</text>
<text class="role" x="740" y="267">• Role-based firewall policy</text>
<text class="role" x="740" y="286">• Client Insights / device profiling</text>

<!-- Identity provider, outside Central -->
<rect x="1120" y="160" width="240" height="140" rx="10" fill="#EFF3F7" stroke="#5A6C7D" stroke-width="2"/>
<text class="lbl2" x="1136" y="188">Microsoft Entra ID</text>
<text class="role" x="1136" y="212">Identity provider</text>
<text class="role" x="1136" y="231">User / Group</text>
<text class="role" x="1136" y="250">» map เป็น Role</text>
<text class="role" x="1136" y="269">บน Central NAC</text>
<path class="auth" marker-end="url(#am-svg-overview)" d="M1072 230 H 1120"/>

<!-- ============ INTERNET ============ -->
<path d="M90 402 a30 30 0 0 1 30-30 h110 a30 30 0 0 1 0 60 h-110 a30 30 0 0 1-30-30z" fill="#EEF3F7" stroke="#8FA6B6" stroke-width="2"/>
<text class="lbl" x="140" y="398">Internet</text>
<text class="tiny" x="115" y="416">WAN ของไซต์</text>

<!-- Site uplink to the cloud: management and auth ride the same physical path but
     terminate in different boxes. Labels sit in the clear band below both runs —
     on the lines they were unreadable against the stroke. -->
<path class="mgmt" d="M175 372 V 348 H 430 V 312"/>
<path class="auth" d="M205 372 V 340 H 800 V 312"/>
<text class="tiny" x="270" y="366" fill="#0B6068" font-weight="700">HTTPS / WSS 443</text>
<text class="tiny" x="420" y="366" fill="#59418F" font-weight="700">RadSec TLS 2083</text>

<!-- ============ FLOWS ============ -->
<circle cx="660" cy="360" r="13" fill="#0E7C86"/><text class="tag" x="655" y="365">1</text>
<text class="role" x="684" y="354" font-size="12">Management: AP » Switch » Firewall » Internet » Central</text>
<text class="role" x="684" y="372" font-size="12">HTTPS / WSS 443 — onboarding, config, telemetry</text>

<circle cx="660" cy="396" r="13" fill="#6B4EA8"/><text class="tag" x="655" y="401">2</text>
<text class="role" x="684" y="390" font-size="12">Authentication: AP » RadSec (TLS 2083) » Central NAC</text>
<text class="role" x="684" y="408" font-size="12">802.1X ส่งต่อไป Entra ID · MAC Auth ตัดสินใจใน cloud</text>

<circle cx="660" cy="432" r="13" fill="#1E6BB8"/><text class="tag" x="655" y="437">3</text>
<text class="role" x="684" y="426" font-size="12">User data (Bridge mode): Client » AP » VLAN ที่ไซต์</text>
<text class="role" x="684" y="444" font-size="12">» Firewall ที่ไซต์ » Internet — ไม่วิ่งผ่าน Central</text>

<!-- ============ SITE ============ -->
<rect class="grp" x="40" y="456" width="1320" height="296" rx="12"/>
<text class="tiny" x="56" y="476">ON-PREM SITE — อุปกรณ์ที่ไซต์ลูกค้า</text>

<rect x="70" y="492" width="190" height="64" rx="9" fill="#FDECEC" stroke="#C0504D" stroke-width="2"/>
<text class="lbl2" x="86" y="518">Firewall / NAT Router</text>
<text class="role" x="86" y="538">ขาออก TCP 443 ถึง Central</text>
<line class="link" x1="165" y1="492" x2="165" y2="432"/>

<rect x="330" y="492" width="280" height="80" rx="9" fill="#E9F2FA" stroke="#1E6BB8" stroke-width="2"/>
<text class="lbl2" x="346" y="516">Access Switch (PoE+)</text>
<text class="role" x="346" y="536">จ่ายไฟ AP · Trunk VLAN ผู้ใช้</text>
<text class="role" x="346" y="554">ไม่ต้อง config อะไรเป็นพิเศษ</text>
<line class="link" x1="260" y1="524" x2="330" y2="524"/>

<rect x="330" y="616" width="130" height="66" rx="9" fill="#E9F7F1" stroke="#14996B" stroke-width="2"/>
<text class="lbl2" x="346" y="642">AP #1</text>
<text class="role" x="346" y="662">PoE+ · Wi-Fi 6/6E</text>
<line class="link" x1="395" y1="572" x2="395" y2="616"/>
<path class="air" d="M360 608 a35 35 0 0 1 50 0"/>
<rect x="480" y="616" width="130" height="66" rx="9" fill="#E9F7F1" stroke="#14996B" stroke-width="2"/>
<text class="lbl2" x="496" y="642">AP #2</text>
<text class="role" x="496" y="662">PoE+ · Roaming</text>
<line class="link" x1="545" y1="572" x2="545" y2="616"/>
<path class="air" d="M510 608 a35 35 0 0 1 50 0"/>
<text class="tiny" x="400" y="598">PoE+</text>

<rect x="680" y="616" width="200" height="66" rx="9" fill="#E8F1F8" stroke="#1E6BB8" stroke-width="2"/>
<text class="lbl2" x="696" y="642">Employee</text>
<text class="role" x="696" y="662">802.1X » Entra ID</text>
<rect x="910" y="616" width="200" height="66" rx="9" fill="#FFF3E6" stroke="#FF8300" stroke-width="2"/>
<text class="lbl2" x="926" y="642">Guest</text>
<text class="role" x="926" y="662">Self-registration portal</text>
<rect x="1140" y="616" width="200" height="66" rx="9" fill="#EFF6F1" stroke="#4B8F6E" stroke-width="2"/>
<text class="lbl2" x="1156" y="642">IoT / Device</text>
<text class="role" x="1156" y="662">PSK + MAC Auth</text>
<path class="air" d="M614 649 H 674" stroke-dasharray="4 4"/>

<!-- data path stays on site -->
<path class="data" marker-end="url(#ad-svg-overview)" d="M700 700 H 400 V 690" />
<text class="role" x="712" y="704" font-size="12" fill="#1A5C9E" font-weight="700">» Firewall ที่ไซต์ » Internet — ไม่วิ่งผ่าน Central</text>
<line class="link" x1="470" y1="682" x2="470" y2="700" stroke-dasharray="4 4"/>

<!-- ============ CALLOUT + LEGEND ============ -->
<rect x="40" y="768" width="830" height="112" rx="10" fill="#FFF8EC" stroke="#E8C88A" stroke-width="1.5"/>
<text class="lbl2" x="58" y="792" fill="#8A5A12">ต่างจาก AOS-8 Controller ตรงไหน</text>
<text class="role" x="58" y="814">AOS-8: traffic ผู้ใช้วิ่งใน GRE tunnel ขึ้น Mobility Controller ก่อนออก Internet</text>
<text class="role" x="58" y="834">CNX: AP bridge ลง VLAN ที่ไซต์เลย cloud เห็นแค่ config / auth / telemetry</text>
<text class="role" x="58" y="854">» Central ล่ม = client ที่ต่ออยู่ยังใช้เน็ตได้ แต่ auth ใหม่และแก้ config จะทำไม่ได้</text>

<rect x="890" y="768" width="470" height="112" rx="10" fill="#F7FAFC" stroke="#E1E9EF" stroke-width="1.5"/>
<path class="mgmt" d="M910 792 H 958"/><text class="tiny" x="968" y="796">Management · HTTPS/WSS 443</text>
<path class="auth" d="M910 818 H 958"/><text class="tiny" x="968" y="822">Authentication · RadSec / RADIUS</text>
<path class="data" d="M910 844 H 958"/><text class="tiny" x="968" y="848">User data · bridge ลง VLAN ที่ไซต์</text>
<path class="air" d="M914 872 a24 24 0 0 1 40 0"/><text class="tiny" x="968" y="872">Wireless (SSID broadcast)</text>
</svg>
