<!-- Shared PoE switch -->
<rect x="330" y="185" width="470" height="122" rx="10" fill="#E8F1F8" stroke="#1E6BB8" stroke-width="2.5"/>
<rect x="330" y="185" width="470" height="26" rx="10" fill="#1E6BB8"/>
<text class="tag" x="344" y="203">SWITCH กลาง (ใช้ร่วมกันทุก Pod) — PoE+</text>
<text class="role" x="344" y="233">• จ่ายไฟ PoE+ ให้ AP ทุก Pod</text>
<text class="role" x="344" y="252">• Trunk VLAN n1–n4 ของทุก Pod ลงพอร์ตที่ต่อ AP</text>
<text class="role" x="344" y="271">• DHCP ที่ไซต์แจก IP ให้ AP และ client</text>
<text class="role" x="344" y="290">• ขาออก TCP 443 ต้องเปิดถึง Central (ไม่ต้องเปิด inbound)</text>

<!-- Cloud column -->
<rect class="cloud" x="986" y="104" width="428" height="248" rx="16"/>

<rect x="1000" y="126" width="400" height="104" rx="10" fill="#E8F1F8" stroke="#1E6BB8" stroke-width="2.5"/>
<rect x="1000" y="126" width="400" height="26" rx="10" fill="#1E6BB8"/>
<text class="tag" x="1014" y="144">HPE ARUBA NETWORKING CENTRAL (CNX) — CLOUD</text>
<text class="role" x="1014" y="174">• Configuration Group + Site แยกต่อ Pod</text>
<text class="role" x="1014" y="193">• License assignment · Firmware compliance</text>
<text class="role" x="1014" y="212">• Monitoring · Floorplan · Reporting</text>

<rect x="1000" y="244" width="400" height="90" rx="10" fill="#F1ECFB" stroke="#6B4EA8" stroke-width="2.5"/>
<text class="lbl2" x="1014" y="268">Central NAC / Policy Manager (Cloud)</text>
<text class="role" x="1014" y="288">• Cloud RADIUS — MAC Auth (Lab 3.1)</text>
<text class="role" x="1014" y="307">• Guest self-registration (Lab 3.2)</text>
<text class="role" x="1014" y="326">• 802.1X + Role-based firewall (Lab 3.3)</text>

<rect x="1000" y="372" width="400" height="58" rx="10" fill="#EFF3F7" stroke="#5A6C7D" stroke-width="2"/>
<text class="lbl2" x="1014" y="396">Microsoft Entra ID — Identity</text>
<text class="role" x="1014" y="416">User / Group » Role บน Central NAC</text>
<path class="auth" marker-end="url(#am-svg-lab)" d="M1200 334 V 372"/>

<!-- site uplink: management to Central, auth to Central NAC -->
