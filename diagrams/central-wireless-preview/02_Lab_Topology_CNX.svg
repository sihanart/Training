<text class="h1" x="40" y="48">Aruba Central (CNX) Wireless Training — Lab Topology</text>
<text class="sub" x="40" y="74">ตัวอย่าง × Commserv Siam · 1 ธ.ค. 2569 · Lab 0–2: Onboarding &amp; Group — Lab 3: WLAN &amp; Auth — Lab 4–7: Monitor, Floorplan, Report</text>
<line x1="40" y1="90" x2="1400" y2="90" stroke="#E1E9EF" stroke-width="2"/>

<!-- Internet + edge -->
<path d="M75 148 a30 30 0 0 1 30-30 h110 a30 30 0 0 1 0 60 h-110 a30 30 0 0 1-30-30z" fill="#EEF3F7" stroke="#8FA6B6" stroke-width="2"/>
