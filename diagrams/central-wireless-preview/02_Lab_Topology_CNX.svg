<text class="role" x="548" y="828" fill="#4C7BA8">Central: Group POD-2 · Site POD-2</text>

<!-- ============ POD n note ============ -->
<rect class="grp" x="1000" y="470" width="400" height="420" rx="12"/>
<rect x="1000" y="470" width="150" height="28" rx="10" fill="#7A8C99"/>
<text class="tag" x="1016" y="489">POD 3 ... POD n</text>
<text class="role" x="1016" y="524">• อุปกรณ์และการต่อสายเหมือน Pod 1 ทุกประการ</text>
<text class="role" x="1016" y="546">• เปลี่ยนเฉพาะ Group / Site / VLAN / ชื่อ SSID</text>
<text class="role" x="1016" y="568">• แนะนำ 2–3 คน/Pod เพื่อให้ทุกคนได้ลงมือ config</text>

<line x1="1016" y1="588" x2="1384" y2="588" stroke="#E1E9EF" stroke-width="1.5"/>
<text class="lbl2" x="1016" y="612">ถ้าอุปกรณ์ไม่พอ (ปรับได้)</text>
<text class="role" x="1016" y="634">• AP: อย่างน้อย 1 ตัว/Pod (2 ตัว จะสาธิต roaming ได้)</text>
<text class="role" x="1016" y="656">• Switch: ใช้ตัวเดียวร่วมกันได้ แยก VLAN ต่อ Pod</text>
<text class="role" x="1016" y="678">• Central: 1 tenant ใช้ร่วม — แยกด้วย Group + Site ต่อ Pod</text>
<text class="role" x="1016" y="700">• Entra ID: ใช้ tenant ทดสอบร่วมกัน แยก user group ต่อ Pod</text>
<text class="role" x="1016" y="722">• License: ต้องมี AP license ครบตามจำนวน AP ที่ onboard</text>

<line x1="1016" y1="742" x2="1384" y2="742" stroke="#E1E9EF" stroke-width="1.5"/>
<text class="lbl2" x="1016" y="766">สิ่งที่ต้องเตรียมก่อนวันอบรม</text>
<text class="role" x="1016" y="788">• Notebook + เบราว์เซอร์ (ไม่ต้องลงโปรแกรม console)</text>
<text class="role" x="1016" y="810">• บัญชี Central ที่มีสิทธิ์ระดับ admin ของ Group ตัวเอง</text>
<text class="role" x="1016" y="832">• มือถือ 1 เครื่อง สำหรับทดสอบ Guest portal + MAC Auth</text>
<text class="role" x="1016" y="854">• Internet ที่ไซต์เปิด TCP 443 ขาออก (และ UDP 123 NTP)</text>
<text class="role" x="1016" y="876">* AP ต้องออกเน็ตได้และเวลาตรงก่อน ถึงจะ onboard เข้า Central สำเร็จ</text>

