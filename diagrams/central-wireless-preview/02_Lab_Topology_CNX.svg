<text class="lbl2" x="696" y="626">AP #2</text>
<text class="role" x="696" y="646">PoE+ · ใช้สาธิต roaming</text>
<rect x="816" y="600" width="122" height="66" rx="9" fill="#F5F7F8" stroke="#8FA6B6" stroke-width="2"/>
<text class="lbl2" x="830" y="626">Notebook</text>
<text class="role" x="830" y="646">เข้า Central + ทดสอบ 802.1X</text>
