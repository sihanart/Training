<text class="td" x="538" y="1062">100</text><text class="td" x="596" y="1062">Transit / Internet uplink</text><text class="td" x="812" y="1062">192.168.100.0/24</text>
<text class="td" x="538" y="1081">200</text><text class="td" x="596" y="1081">Services: DHCP / DNS / NTP</text><text class="td" x="812" y="1081">192.168.200.0/24</text>

