<?xml version="1.0" encoding="UTF-8"?>
<svg width="1440" height="760" id="svg-switchlab" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 760">
<defs><style>#svg-switchlab text{font-family:"IBM Plex Sans Thai","Sarabun","Loma","Noto Sans Thai","Segoe UI",sans-serif;fill:#0F1E2E}#svg-switchlab .h1{font-size:26px;font-weight:700}#svg-switchlab .sub{font-size:13.5px;fill:#5A6C7D}#svg-switchlab .lbl2{font-size:13px;font-weight:700}#svg-switchlab .role{font-size:11.5px;fill:#41545F}#svg-switchlab .tiny{font-size:11px;fill:#5A6C7D}#svg-switchlab .th{font-size:10.5px;font-weight:700;fill:#1E6BB8;letter-spacing:.06em}#svg-switchlab .td{font-size:11.5px;fill:#33454F}#svg-switchlab .mono2{font-family:"IBM Plex Mono",monospace;font-size:11.5px}#svg-switchlab .ip{font-family:"IBM Plex Mono",monospace;font-size:12px;font-weight:600;fill:#1E6BB8}#svg-switchlab .port{font-family:"IBM Plex Mono",monospace;font-size:10px;fill:#41545F}#svg-switchlab .link{stroke:#4A6274;stroke-width:2.5;fill:none}#svg-switchlab .lag{stroke:#0E7C86;stroke-width:4;fill:none}#svg-switchlab .ag{fill:#C4620A;font-size:13px;font-weight:700}#svg-switchlab .agsub{fill:#C4620A;font-size:11.5px}#svg-switchlab .l3{font-size:10.5px;font-weight:700;fill:#C4620A;letter-spacing:.06em}</style></defs>

<rect width="1440" height="760" fill="#FFFFFF"/>
<text class="h1" x="40" y="46">Switch Lab บน PNETLAB</text>
<text class="sub" x="40" y="70">IT Green — Authorized Aruba (HPE) Networking Training · 3 ก.ย. 2569 · VLAN + Trunk + LAG · PC คนละ VLAN เพื่อทดสอบ inter-VLAN routing</text>
<line x1="40" y1="86" x2="1400" y2="86" stroke="#E1E9EF" stroke-width="2"/>

<!-- what the whole picture is for -->
<text class="ag" x="495" y="140" text-anchor="middle">Inter-VLAN routing — SVI อยู่บน CX-SW-1 ตัวเดียว</text>
<text class="agsub" x="495" y="161" text-anchor="middle">VLAN 10 / 20 / 30 · gateway .1 ของแต่ละวง</text>

<rect x="170" y="200" width="200" height="72" rx="10" fill="#FFF6EC" stroke="#C4620A" stroke-width="2.5"/><text class="lbl2" x="270" y="230" text-anchor="middle">CX-SW-1</text><text class="ip" x="270" y="252" text-anchor="middle">192.168.0.2/24</text><text class="l3" x="270" y="190" text-anchor="middle">L3 — SVI</text>
<rect x="620" y="200" width="200" height="72" rx="10" fill="#E9F2FA" stroke="#1E6BB8" stroke-width="2.5"/><text class="lbl2" x="720" y="230" text-anchor="middle">CX-SW-2</text><text class="ip" x="720" y="252" text-anchor="middle">192.168.0.3/24</text>

<!-- LAG: two members, drawn as two lines because that is the lesson -->
<line class="lag" x1="370" y1="222" x2="620" y2="222"/>
<rect x="374" y="212" width="48" height="20" rx="10" fill="#FFFFFF" stroke="#9FB4BD"/><text class="port" x="398" y="226" text-anchor="middle">1/1/1</text><rect x="568" y="212" width="48" height="20" rx="10" fill="#FFFFFF" stroke="#9FB4BD"/><text class="port" x="592" y="226" text-anchor="middle">1/1/1</text>
<line class="lag" x1="370" y1="258" x2="620" y2="258"/>
<rect x="374" y="248" width="48" height="20" rx="10" fill="#FFFFFF" stroke="#9FB4BD"/><text class="port" x="398" y="262" text-anchor="middle">1/1/2</text><rect x="568" y="248" width="48" height="20" rx="10" fill="#FFFFFF" stroke="#9FB4BD"/><text class="port" x="592" y="262" text-anchor="middle">1/1/2</text>
<text class="lbl2" x="495" y="292" text-anchor="middle" fill="#0E7C86">LAG 1 · LACP active</text>
<text class="tiny" x="495" y="310" text-anchor="middle">vlan trunk allowed 10,20,30</text>

<!-- PCs on the pair -->
<rect x="15" y="206" width="124" height="60" rx="9" fill="#F5F7F8" stroke="#8FA6B6" stroke-width="2"/><text class="lbl2" x="77" y="232" text-anchor="middle">PC1</text><text class="tiny" x="77" y="251" text-anchor="middle">VLAN 10 · .11</text>
<line class="link" x1="139" y1="236" x2="170" y2="236"/>
<rect x="130" y="180" width="48" height="20" rx="10" fill="#FFFFFF" stroke="#9FB4BD"/><text class="port" x="154" y="194" text-anchor="middle">1/1/3</text>

<rect x="860" y="206" width="124" height="60" rx="9" fill="#F5F7F8" stroke="#8FA6B6" stroke-width="2"/><text class="lbl2" x="922" y="232" text-anchor="middle">PC2</text><text class="tiny" x="922" y="251" text-anchor="middle">VLAN 20 · .12</text>
<line class="link" x1="820" y1="236" x2="860" y2="236"/>
<rect x="816" y="180" width="48" height="20" rx="10" fill="#FFFFFF" stroke="#9FB4BD"/><text class="port" x="840" y="194" text-anchor="middle">1/1/3</text>

<!-- plain trunk down to the third switch -->
<rect x="395" y="450" width="200" height="72" rx="10" fill="#E9F2FA" stroke="#1E6BB8" stroke-width="2.5"/><text class="lbl2" x="495" y="480" text-anchor="middle">CX-SW-3</text><text class="ip" x="495" y="502" text-anchor="middle">192.168.0.4/24</text>
<line class="link" x1="270" y1="272" x2="445" y2="450"/>
<rect x="276" y="293" width="48" height="20" rx="10" fill="#FFFFFF" stroke="#9FB4BD"/><text class="port" x="300" y="307" text-anchor="middle">1/1/4</text><rect x="391" y="409" width="48" height="20" rx="10" fill="#FFFFFF" stroke="#9FB4BD"/><text class="port" x="415" y="423" text-anchor="middle">1/1/1</text>
<text class="lbl2" x="352" y="404" text-anchor="middle" fill="#4A6274">Trunk</text>

<rect x="433" y="590" width="124" height="60" rx="9" fill="#F5F7F8" stroke="#8FA6B6" stroke-width="2"/><text class="lbl2" x="495" y="616" text-anchor="middle">PC3</text><text class="tiny" x="495" y="635" text-anchor="middle">VLAN 30 · .13</text>
<line class="link" x1="495" y1="522" x2="495" y2="590"/>
<rect x="471" y="546" width="48" height="20" rx="10" fill="#FFFFFF" stroke="#9FB4BD"/><text class="port" x="495" y="560" text-anchor="middle">1/1/3</text>

<!-- how to get in -->
<rect x="1000" y="120" width="400" height="150" rx="10" fill="#F3F7FA" stroke="#4A6274" stroke-width="2"/>
<text class="lbl2" x="1018" y="146">เข้าใช้งาน PNETLAB</text>
<text class="td" x="1018" y="172">URL</text><text class="td mono2" x="1140" y="172">http://10.69.11.10/</text>
<text class="td" x="1018" y="194">ผู้ใช้</text><text class="td mono2" x="1140" y="194">pod1 – pod7</text>
<text class="td" x="1018" y="216">รหัสผ่าน</text><text class="td mono2" x="1140" y="216">P@ssw0rd</text>
<text class="tiny" x="1018" y="246">ทุกคนในชุดใช้ล็อกอินเดียวกัน — ตกลงกันก่อนว่าใครกดอะไร</text>

<rect x="1000" y="300" width="400" height="212" rx="10" fill="#F7FAFC" stroke="#E1E9EF" stroke-width="1.5"/>
<text class="lbl2" x="1018" y="326">ค่าที่ใช้ในผังนี้</text>
<text class="th" x="1018" y="348">รายการ</text><text class="th" x="1190" y="348">ค่า</text>
<line x1="1018" y1="354" x2="1382" y2="354" stroke="#DCE6ED"/>
<text class="td" x="1018" y="372">CX-SW-1 (L3)</text><text class="td mono2" x="1190" y="372">192.168.0.2 · ถือ SVI ทั้งสามวง</text>
<text class="td" x="1018" y="392">CX-SW-2 · CX-SW-3</text><text class="td mono2" x="1190" y="392">192.168.0.3 · 192.168.0.4 (L2)</text>
<text class="td" x="1018" y="412">PC1 · VLAN 10</text><text class="td mono2" x="1190" y="412">10.10.10.11 » gw 10.10.10.1</text>
<text class="td" x="1018" y="432">PC2 · VLAN 20</text><text class="td mono2" x="1190" y="432">10.10.20.12 » gw 10.10.20.1</text>
<text class="td" x="1018" y="452">PC3 · VLAN 30</text><text class="td mono2" x="1190" y="452">10.10.30.13 » gw 10.10.30.1</text>
<text class="td" x="1018" y="472">LAG 1 (SW1–SW2)</text><text class="td mono2" x="1190" y="472">1/1/1 + 1/1/2 · LACP active</text>
<text class="td" x="1018" y="492">Trunk (SW1–SW3)</text><text class="td mono2" x="1190" y="492">SW1 1/1/4 » SW3 1/1/1</text>

<rect x="1000" y="534" width="400" height="146" rx="10" fill="#F7FAFC" stroke="#E1E9EF" stroke-width="1.5"/>
<text class="lbl2" x="1018" y="560">อ่านผังนี้อย่างไร</text>
<text class="role" x="1018" y="584">• สวิตช์สามตัวเป็น VM คนละชุดกับเพื่อน — พังได้ reset ใหม่ได้</text>
<text class="role" x="1018" y="609">• SVI อยู่บน CX-SW-1 ตัวเดียว อีกสองตัวเป็น L2 ล้วน ๆ</text>
<text class="role" x="1018" y="634">• LAG กับ Trunk ต่างกันแค่จำนวนสาย — allowed VLAN ต้องตรงกันสองฝั่ง</text>
<text class="role" x="1018" y="659">• หลักสูตรนี้ยังไม่แตะ VSX / Active Gateway — อยู่ในหลักสูตร Advance</text>

<line class="lag" x1="60" y1="700" x2="108" y2="700"/><text class="tiny" x="118" y="704">LAG 1 — สองสายรวมเป็นเส้นเดียว</text>
<line class="link" x1="380" y1="700" x2="428" y2="700"/><text class="tiny" x="438" y="704">Trunk / Access — สายเดี่ยว</text>
<text class="tiny" x="700" y="704">กล่องส้ม = สวิตช์ที่ทำ routing · กล่องฟ้า = L2 ล้วน</text>
</svg>
