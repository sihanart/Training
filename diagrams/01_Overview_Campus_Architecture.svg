<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 830" width="1400" height="830">
<defs>
<style>
text{font-family:"Loma","Noto Sans Thai","Sarabun","Segoe UI",sans-serif;fill:#0F1E2E}
.h1{font-size:28px;font-weight:700}
.sub{font-size:14px;fill:#5A6C7D}
.lbl{font-size:15px;font-weight:700}
.role{font-size:11.5px;fill:#41545F}
.tiny{font-size:11px;fill:#5A6C7D}
.tag{font-size:11px;font-weight:700;fill:#fff}
.link{stroke:#4A6274;stroke-width:2.5;fill:none}
.link10{stroke:#0E7C86;stroke-width:5;fill:none;stroke-linecap:round}
.tunnel{stroke:#FF8300;stroke-width:3;stroke-dasharray:9 6;fill:none}
.radius{stroke:#6B4EA8;stroke-width:2.5;stroke-dasharray:3 5;fill:none}
.air{stroke:#14996B;stroke-width:2;fill:none;opacity:.75}
.grp{fill:#FAFCFE;stroke:#C7D6E2;stroke-width:1.5;stroke-dasharray:6 5}
</style>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0 0 L10 5 L0 10 z" fill="#FF8300"/></marker>
<marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0 0 L10 5 L0 10 z" fill="#1E6BB8"/></marker>
</defs>

<rect width="1400" height="830" fill="#FFFFFF"/>
<text class="h1" x="40" y="48">Aruba Campus Architecture — Overview</text>
<text class="sub" x="40" y="72">Switch + Controller + AP · Device roles &amp; traffic flow — RMUTT / Commserv Siam · 26 ส.ค. 2569</text>
<line x1="40" y1="88" x2="1360" y2="88" stroke="#E1E9EF" stroke-width="2"/>

<!-- Internet -->
<path d="M120 150 a34 34 0 0 1 34-34 h96 a34 34 0 0 1 0 68 h-96 a34 34 0 0 1-34-34z" fill="#EEF3F7" stroke="#8FA6B6" stroke-width="2"/>
<text class="lbl" x="175" y="145">Internet</text>
<text class="tiny" x="150" y="163">WAN / ISP</text>

<!-- Firewall -->
<rect x="120" y="230" width="170" height="62" rx="8" fill="#FDECEC" stroke="#C0504D" stroke-width="2"/>
<text class="lbl" x="140" y="256">Firewall / Edge</text>
<text class="role" x="140" y="276">NAT · Security policy</text>
<line class="link" x1="205" y1="184" x2="205" y2="230"/>

<!-- Core -->
<rect x="430" y="205" width="360" height="126" rx="10" fill="#E8F1F8" stroke="#1E6BB8" stroke-width="2.5"/>
<rect x="430" y="205" width="360" height="26" rx="10" fill="#1E6BB8"/>
<text class="tag" x="444" y="223">CORE / DISTRIBUTION LAYER</text>
<text class="lbl" x="444" y="253">Aruba CX 8325 / CX 6300M</text>
<text class="role" x="444" y="275">บทบาท: Inter-VLAN routing (SVI) · Static / OSPF</text>
<text class="role" x="444" y="295">DHCP relay (ip helper) · Default route ออก Internet</text>
<text class="role" x="444" y="315">10/25GbE uplink · LAG · QoS</text>
<line class="link" x1="290" y1="261" x2="430" y2="261"/>

<!-- Mobility Controller -->
<rect x="950" y="180" width="400" height="118" rx="10" fill="#FFF3E6" stroke="#FF8300" stroke-width="2.5"/>
<rect x="950" y="180" width="400" height="26" rx="10" fill="#FF8300"/>
<text class="tag" x="964" y="198">WLAN CONTROL PLANE + DATA PLANE</text>
<text class="lbl" x="964" y="228">Mobility Controller (AOS-8) — Aruba 7010 / VMC</text>
<text class="role" x="964" y="248">บทบาท: AP termination (GRE tunnel) · SSID/WLAN &amp; VLAN</text>
<text class="role" x="964" y="266">User Role &amp; Policy (Firewall/AppRF) · Captive portal</text>
<text class="role" x="964" y="284">Centralized management + Dashboard</text>
<path class="link10" d="M790 250 H 950"/>
<text class="tiny" x="812" y="240">LAG 2x10G</text>

<!-- ClearPass -->
<rect x="950" y="330" width="400" height="86" rx="10" fill="#F1ECFB" stroke="#6B4EA8" stroke-width="2.5"/>
<text class="lbl" x="964" y="358">ClearPass Policy Manager (RADIUS)</text>
<text class="role" x="964" y="378">802.1X (wired + wireless) · MAC Authentication</text>
<text class="role" x="964" y="396">Guest / Captive portal · Role assignment (VLAN, ACL)</text>
<path class="radius" d="M950 373 H 830 V 331"/>
<text class="tiny" x="836" y="366">RADIUS</text>

<!-- Services -->
<rect x="950" y="446" width="400" height="72" rx="10" fill="#EFF6F1" stroke="#4B8F6E" stroke-width="2"/>
<text class="lbl" x="964" y="472">Core Services</text>
<text class="role" x="964" y="492">DHCP · DNS · NTP · CA (Certificate) · Syslog</text>
<path class="link" d="M950 482 H 880 V 331"/>

<!-- Access layer group -->
<rect class="grp" x="180" y="390" width="640" height="130" rx="12"/>
<text class="tiny" x="196" y="410">ACCESS LAYER</text>

<rect x="230" y="420" width="250" height="80" rx="9" fill="#E9F2FA" stroke="#1E6BB8" stroke-width="2"/>
<text class="lbl" x="246" y="446">Aruba CX 6300F (Stack)</text>
<text class="role" x="246" y="466">PoE+ · 10GbE uplink · VSF Stacking</text>
<text class="role" x="246" y="484">VLAN · LAG · 802.1X port-based</text>

<rect x="520" y="420" width="250" height="80" rx="9" fill="#E9F2FA" stroke="#1E6BB8" stroke-width="2"/>
<text class="lbl" x="536" y="446">Aruba CX 6200F</text>
<text class="role" x="536" y="466">PoE+ · Edge port สำหรับ user</text>
<text class="role" x="536" y="484">VLAN · 802.1X / MAC Auth</text>

<path class="link10" d="M540 331 L 380 420"/>
<path class="link10" d="M660 331 L 645 420"/>
<text class="tiny" x="344" y="372">Uplink 10G / LAG</text>

<!-- APs -->
<rect x="230" y="580" width="120" height="62" rx="9" fill="#E9F7F1" stroke="#14996B" stroke-width="2"/>
<text class="lbl" x="248" y="606">AP-515</text>
<text class="role" x="248" y="626">PoE+ · Wi-Fi 6</text>
<rect x="380" y="580" width="120" height="62" rx="9" fill="#E9F7F1" stroke="#14996B" stroke-width="2"/>
<text class="lbl" x="398" y="606">AP-505</text>
<text class="role" x="398" y="626">PoE+ · Wi-Fi 6</text>
<line class="link" x1="290" y1="500" x2="290" y2="580"/>
<line class="link" x1="440" y1="500" x2="440" y2="580"/>
<text class="tiny" x="298" y="546">PoE+</text>

<!-- wireless clients -->
<path class="air" d="M300 572 a44 44 0 0 1 60 0"/>
<path class="air" d="M312 560 a30 30 0 0 1 36 0"/>
<rect x="250" y="690" width="230" height="58" rx="9" fill="#F5F7F8" stroke="#8FA6B6" stroke-width="2"/>
<text class="lbl" x="266" y="714">Wireless Clients</text>
<text class="role" x="266" y="734">Notebook / Smartphone / IoT</text>
<line class="link" x1="365" y1="642" x2="365" y2="690" stroke-dasharray="4 4"/>

<!-- wired client -->
<rect x="620" y="580" width="180" height="62" rx="9" fill="#F5F7F8" stroke="#8FA6B6" stroke-width="2"/>
<text class="lbl" x="636" y="606">Wired Client / PC</text>
<text class="role" x="636" y="626">802.1X supplicant, DHCP</text>
<line class="link" x1="690" y1="500" x2="690" y2="580"/>

<!-- Traffic flows -->
<circle cx="880" cy="600" r="13" fill="#1E6BB8"/><text class="tag" x="875" y="605">1</text>
<text class="role" x="900" y="592" font-size="12.5">Wired flow: PC » Access SW (VLAN/802.1X)</text>
<text class="role" x="900" y="610" font-size="12.5"> » Core (routing, DHCP relay) » Firewall » Internet</text>

<circle cx="880" cy="656" r="13" fill="#FF8300"/><text class="tag" x="875" y="661">2</text>
<text class="role" x="900" y="648" font-size="12.5">Wireless flow (Tunnel mode): Client » AP » GRE tunnel</text>
<text class="role" x="900" y="666" font-size="12.5">ผ่าน Switch/Core » Mobility Controller » ปล่อยลง VLAN » Internet</text>

<path class="tunnel" marker-end="url(#ar)" d="M500 612 C 700 604 850 500 952 306"/>
<text class="tiny" x="516" y="552" fill="#C4620A" font-size="12.5" font-weight="700">GRE Tunnel: AP » Mobility Controller</text>

<!-- legend -->
<rect x="40" y="770" width="1320" height="44" rx="8" fill="#F7FAFC" stroke="#E1E9EF"/>
<line class="link" x1="60" y1="792" x2="110" y2="792"/><text class="tiny" x="118" y="796">Copper 1G</text>
<line class="link10" x1="210" y1="792" x2="260" y2="792"/><text class="tiny" x="268" y="796">10G / LAG (Fiber)</text>
<path class="tunnel" d="M400 792 H 450"/><text class="tiny" x="458" y="796">GRE Tunnel (AP — MC)</text>
<path class="radius" d="M620 792 H 670"/><text class="tiny" x="678" y="796">RADIUS (802.1X / MAC Auth)</text>
<path class="air" d="M840 796 a26 26 0 0 1 34 0"/><text class="tiny" x="884" y="796">Wireless (SSID)</text>
<text class="tiny" x="1010" y="796">หัวข้อ: Campus architecture · Traffic flow &amp; device roles (10:30 น.)</text>
</svg>
