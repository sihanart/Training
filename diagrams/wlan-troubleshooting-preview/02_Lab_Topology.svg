<rect width="1440" height="1000" fill="#FFFFFF"/>
<text class="h1" x="40" y="48">Aruba WLAN Troubleshooting — Lab Topology</text>
<text class="sub" x="40" y="74">ตัวอย่าง × Commserv Siam · 16 ธ.ค. 2569 · Workshop ครึ่งวันอยู่บน Controller VM ของชุด — ไม่มีสวิตช์ให้ตั้งค่า</text>
<line x1="40" y1="90" x2="1400" y2="90" stroke="#E1E9EF" stroke-width="2"/>

<!-- everything virtual lives on the one host -->
<rect class="host" x="60" y="128" width="560" height="620" rx="14"/>
<rect x="60" y="128" width="250" height="28" rx="10" fill="#5A6C7D"/>
<text class="tag" x="76" y="147">HCI Server — รัน VM ทั้งหมด</text>

