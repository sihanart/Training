<rect x="102" y="331" width="476" height="24" fill="#FFFAF4"/><text class="td" x="112" y="348">POD 5</text><text class="td mono2" x="212" y="348">192.168.10.225</text><text class="td mono2" x="376" y="348">VLAN 2605</text>
<rect x="102" y="355" width="476" height="24" fill="#FFFFFF"/><text class="td" x="112" y="372">POD 6</text><text class="td mono2" x="212" y="372">192.168.10.226</text><text class="td mono2" x="376" y="372">VLAN 2606</text>
<rect x="102" y="379" width="476" height="24" fill="#FFFAF4"/><text class="td" x="112" y="396">POD 7</text><text class="td mono2" x="212" y="396">192.168.10.227</text><text class="td mono2" x="376" y="396">VLAN 2607</text>
<rect x="102" y="403" width="476" height="24" fill="#FFE8CC"/><text class="td tteach" x="112" y="420">TEACHER</text><text class="td mono2" x="212" y="420">192.168.10.133</text><text class="td mono2" x="376" y="420">VLAN 2608</text>
<text class="tiny" x="102" y="446">แต่ละตัวเป็น DHCP + NAT ของ AP VLAN ตัวเอง (10.26.n.0/24)</text>
<text class="tiny" x="102" y="464">ใช้ตลอด Workshop — DEMO และ LAB 1–2 อยู่บนเครื่องนี้เครื่องเดียว</text>

<rect x="84" y="500" width="512" height="226" rx="10" fill="#F3F7FA" stroke="#4A6274" stroke-width="2.5"/>
<text class="lbl2" x="102" y="526">Controller VM ของชุด — ข้อควรรู้</text>
<text class="role" x="102" y="552">• แยก VM ต่อชุด — ทำอะไรก็ไม่กระทบชุดอื่น</text>
<text class="role" x="102" y="574">• เข้าได้ทั้ง CLI (console) และ Web UI (HTTPS)</text>
<text class="role" x="102" y="596">• พัง reset ใหม่ได้ ไม่กระทบชุดอื่น</text>
<text class="role" x="102" y="618">• เป็นเครื่องเดียวที่ใช้ตลอด Workshop ไม่มีสวิตช์จำลองให้ฝึก</text>
<line x1="102" y1="640" x2="578" y2="640" stroke="#CBD8E2"/>
<text class="lbl2" x="102" y="664">ทำไมแยก Controller VM ต่อชุด</text>
<text class="role" x="102" y="688">แต่ละชุดมีสิทธิ์ admin เต็มบนเครื่องตัวเอง ไม่ต้องรอคิว</text>
<text class="role" x="102" y="708">AP onboarding ของจริง ไม่ใช่ demo ร่วมกันทั้งห้อง</text>

