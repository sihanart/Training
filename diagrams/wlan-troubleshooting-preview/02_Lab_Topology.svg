<text class="th" x="102" y="226">ชุด</text><text class="th" x="212" y="226">MGMT</text><text class="th" x="376" y="226">AP VLAN</text>
<line x1="102" y1="231" x2="578" y2="231" stroke="#F0D6BC"/>
<rect x="102" y="235" width="476" height="24" fill="#FFFAF4"/><text class="td" x="112" y="252">POD 1</text><text class="td mono2" x="212" y="252">192.168.10.221</text><text class="td mono2" x="376" y="252">VLAN 2601</text>
