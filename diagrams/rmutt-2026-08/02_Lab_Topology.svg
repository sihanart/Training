<rect x="1040" y="150" width="340" height="118" rx="10" fill="#F3EEFA" stroke="#6B4EA8" stroke-width="2.5"/>
<rect x="1040" y="150" width="340" height="26" rx="10" fill="#6B4EA8"/>
