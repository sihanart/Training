<text class="lbl2" x="686" y="200">Aruba 9004-LTE</text>
<text class="role" x="686" y="222">ตัวจริง · จบ IPsec tunnel ของ AP-515</text>
<text class="role" x="686" y="242">ดึงไซต์ปลายทางกลับเข้าวงของแลบ</text>
<text class="role" x="686" y="262">มีตัวเดียวใช้ร่วมทุกชุด — ผู้สอนคุม</text>

