<text class="lbl2" x="1054" y="200">AP-515 (RAP)</text>
<text class="role" x="1054" y="222">มีตัวเดียวใช้ร่วมทั้งห้อง</text>
<text class="role" x="1054" y="242">จบ IPsec ที่ Aruba 9004-LTE</text>
<text class="role" x="1054" y="262">มีพอร์ต wired ให้ต่อสวิตช์ด้านล่าง</text>
<rect x="1040" y="320" width="340" height="118" rx="10" fill="#E9F2FA" stroke="#1E6BB8" stroke-width="2.5"/>
<rect x="1040" y="320" width="340" height="26" rx="10" fill="#1E6BB8"/>
