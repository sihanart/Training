<rect width="1440" height="1000" fill="#FFFFFF"/>
<text class="h1" x="40" y="48">Aruba Campus Network Training — Lab Topology</text>
<text class="sub" x="40" y="74">RMUTT × Commserv Siam · 26 ส.ค. 2569 · RAP จบที่ Aruba 9004-LTE · Campus AP จบที่ Controller VM ของชุดตัวเอง · 7 ชุดนักศึกษา + 1 ชุดผู้สอน</text>
<line x1="40" y1="90" x2="1400" y2="90" stroke="#E1E9EF" stroke-width="2"/>

<!-- everything virtual lives on the one host -->
<rect class="host" x="60" y="128" width="560" height="620" rx="14"/>
<rect x="60" y="128" width="250" height="28" rx="10" fill="#5A6C7D"/>
<text class="tag" x="76" y="147">HCI Server — รัน VM ทั้งหมด</text>

<rect x="84" y="178" width="512" height="300" rx="10" fill="#FFF3E6" stroke="#FF8300" stroke-width="2.5"/>
<text class="lbl2" x="102" y="204">Mobility Controller (VM) — 1 ตัวต่อ 1 ชุด</text>
<text class="th" x="102" y="226">ชุด</text><text class="th" x="212" y="226">CONTROLLER IP</text><text class="th" x="376" y="226">AP VLAN</text>
<line x1="102" y1="231" x2="578" y2="231" stroke="#F0D6BC"/>
<rect x="102" y="235" width="476" height="24" fill="#FFFAF4"/><text class="td" x="112" y="252">POD 1</text><text class="td mono2" x="212" y="252">192.168.10.221</text><text class="td mono2" x="376" y="252">VLAN 2601</text>
<rect x="102" y="259" width="476" height="24" fill="#FFFFFF"/><text class="td" x="112" y="276">POD 2</text><text class="td mono2" x="212" y="276">192.168.10.222</text><text class="td mono2" x="376" y="276">VLAN 2602</text>
<rect x="102" y="283" width="476" height="24" fill="#FFFAF4"/><text class="td" x="112" y="300">POD 3</text><text class="td mono2" x="212" y="300">192.168.10.223</text><text class="td mono2" x="376" y="300">VLAN 2603</text>
<rect x="102" y="307" width="476" height="24" fill="#FFFFFF"/><text class="td" x="112" y="324">POD 4</text><text class="td mono2" x="212" y="324">192.168.10.224</text><text class="td mono2" x="376" y="324">VLAN 2604</text>
<rect x="102" y="331" width="476" height="24" fill="#FFFAF4"/><text class="td" x="112" y="348">POD 5</text><text class="td mono2" x="212" y="348">192.168.10.225</text><text class="td mono2" x="376" y="348">VLAN 2605</text>
<rect x="102" y="355" width="476" height="24" fill="#FFFFFF"/><text class="td" x="112" y="372">POD 6</text><text class="td mono2" x="212" y="372">192.168.10.226</text><text class="td mono2" x="376" y="372">VLAN 2606</text>
<rect x="102" y="379" width="476" height="24" fill="#FFFAF4"/><text class="td" x="112" y="396">POD 7</text><text class="td mono2" x="212" y="396">192.168.10.227</text><text class="td mono2" x="376" y="396">VLAN 2607</text>
<rect x="102" y="403" width="476" height="24" fill="#FFE8CC"/><text class="td tteach" x="112" y="420">TEACHER</text><text class="td mono2" x="212" y="420">192.168.10.133</text><text class="td mono2" x="376" y="420">VLAN 2608</text>
<text class="tiny" x="102" y="446">แต่ละตัวเป็น DHCP + NAT ของ AP VLAN ตัวเอง (10.26.n.0/24) · ผู้สอนเตรียมไว้ให้แล้ว</text>
<text class="tiny" x="102" y="464">เป็นปลายทาง GRE ของ Campus AP ในชุดนั้น</text>

<rect x="84" y="500" width="512" height="226" rx="10" fill="#F3F7FA" stroke="#4A6274" stroke-width="2.5"/>
<text class="lbl2" x="102" y="526">PNETLAB — Switch simulator</text>
<text class="role" x="102" y="552">• VM สวิตช์จำลอง 1 ตัวต่อนักศึกษา 1 คน</text>
<text class="role" x="102" y="574">• เข้าผ่านเบราว์เซอร์ ไม่ต้องต่อสายอะไร</text>
<text class="role" x="102" y="596">• ใช้ทำ Module 1 ทั้งหมด — VLAN, Trunk, LAG, SVI, routing</text>
<text class="role" x="102" y="618">• พังได้ไม่กลัว reset แล้วเริ่มใหม่ได้</text>
<line x1="102" y1="640" x2="578" y2="640" stroke="#CBD8E2"/>
<text class="lbl2" x="102" y="664">ทำไมไม่ฝึกบนสวิตช์จริง</text>
<text class="role" x="102" y="688">Aruba CX 6100 มี 12 พอร์ตและเป็นทางผ่านของทุกชุด</text>
<text class="role" x="102" y="708">ถ้าใครพิมพ์ผิดจะล้มทั้งห้อง จึงแยกที่ฝึกไปไว้บน simulator</text>

<!-- the only box the remote AP tunnels to -->
<rect x="672" y="150" width="316" height="130" rx="10" fill="#FDECEC" stroke="#C0504D" stroke-width="2.5"/>
<rect x="672" y="150" width="316" height="26" rx="10" fill="#C0504D"/>
