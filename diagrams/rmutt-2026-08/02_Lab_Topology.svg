<text class="lbl2" x="1054" y="370">Aruba CX 6100 · 12 พอร์ต</text>
<text class="role" x="1054" y="392">uplink 1/1/12 ขึ้น RAP</text>
<text class="role" x="1054" y="412">พอร์ต 1–8 = Campus AP ชุดละพอร์ต</text>
<text class="role" x="1054" y="432">access VLAN 260n · trunk 2601–2608</text>
<rect x="1040" y="490" width="340" height="118" rx="10" fill="#E9F7F1" stroke="#14996B" stroke-width="2.5"/>
<rect x="1040" y="490" width="340" height="26" rx="10" fill="#14996B"/>
<text class="tag" x="1054" y="508">CAMPUS AP</text>
<text class="lbl2" x="1054" y="540">Access Point — ชุดละ 1 ตัว</text>
<text class="role" x="1054" y="562">เสียบ Aruba CX 6100 · รับ PoE และ IP</text>
<text class="role" x="1054" y="582">ทำ GRE กลับ Controller VM ของชุด</text>

<rect x="1040" y="660" width="340" height="76" rx="10" fill="#F5F7F8" stroke="#8FA6B6" stroke-width="2"/>
<text class="lbl2" x="1054" y="686">Wireless clients</text>
<text class="role" x="1054" y="708">โน้ตบุ๊ก / มือถือ ของผู้เข้าอบรม</text>

